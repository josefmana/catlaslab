<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forward Blocking – Online Replication</title>

    <!-- jsPsych core -->
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugin-html-button-response.js"></script>
    <script src="jspsych/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugin-preload.js"></script>
    
    <!-- Experiment config and stimuli -->
    <script src="config/settings.js"></script>
    <script src="stimuli/cues.js"></script>
    <script src="stimuli/outcomes.js"></script>
    <script src="../../../common/components/designs/lepelley2007.js"></script>
    
    <!-- Generic utilities -->
    <script src="../../../common/components/utils/randomisation.js"></script>
    <script src="../../../common/components/utils/helpers.js"></script>
    <script src="../../../common/components/utils/renderCues.js"></script>
    
    <!-- Generic stage builders -->
    <script src="../../../common/components/stages/buildBlock.js"></script>
    <script src="../../../common/components/stages/buildStageBlocks.js"></script>
    <script src="../../../common/components/stages/buildStageTrials.js"></script>
    
    <!-- Generic trial factories -->
    <script src="../../../common/components/trials/makeInstructionTrial.js"></script>
    <script src="../../../common/components/trials/makeLearningTrial.js"></script>
    <script src="../../../common/components/trials/makeTestTrial.js"></script>

    <!-- Experiment-specific orchestrator -->
    <script src="buildTimeline.js"></script>

    <link href="jspsych/jspsych.css" rel="stylesheet" />
  </head>
  <body></body>
  <script>
    
    // ── JATOS detection ──────────────────────────────────────────────────────
    const runOnServer = (typeof jatos !== "undefined");
    
    // ── Start jsPsych ────────────────────────────────────────────────────────
    const jsPsych = initJsPsych({
      on_trial_finish: function(data) {
        if (runOnServer) jatos.appendResultData(JSON.stringify(data));
      },
      on_finish: function() {
        if (runOnServer) {
          jatos.endStudy();
        } else {
          jsPsych.data.get().localSave("json", "mydata.json");
        }
      }
    });
    
    // ── Randomise stimulus mappings ──────────────────────────────────────────
    const cueMap     = randomisePairings(cues, chemicals);
    const outcomeMap = randomisePairwise(outcomes, sideEffects);
    
    const saveMaps = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "",
      trial_duration: 0,
      choices: "NO_KEYS",
      data: {
        cueMap:     JSON.stringify(cueMap),
        outcomeMap: JSON.stringify(
          Object.fromEntries(
            Object.entries(outcomeMap).map(([k, v]) => [k, Array.isArray(v) ? v.map(extractFilename) : extractFilename(v)])
          )
        )
      }
    };
    
    // ── Preload ──────────────────────────────────────────────────────────────
    const preload = {
      type: jsPsychPreload,
      images: [sideEffects, images.cuePicture],
    };
    
    // ── Build & run timeline ─────────────────────────────────────────────────
    const timeline = [
      preload,
      saveMaps,
      ...buildTimeline({ design, settings, cueMap, outcomeMap }),
    ];

    jsPsych.run(timeline);
  </script>
</html>
